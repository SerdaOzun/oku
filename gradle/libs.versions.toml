[versions]
compose-plugin = "1.7.3"
kotlin = "2.1.0"

exposedVersion = "0.50.1"
sqliteVersion = "3.45.3.0"
precomposeVersion = "1.6.2"
flywayVersion = "10.11.1"
koinVersion = "4.0.0"
conveyorVersion = "1.5"
logbackVersion = "1.5.10"
okhttpVersion = "4.12.0"
gsonVersion = "2.11.0"
testngVersion = "7.10.2"
kotestVersion = "5.9.1"
carbonDesignVersion = "0.3.1"
config4kVersion = "0.7.0"
koalaplotVersion = "0.8.0"

#Language Segmentation
#kotoriVersion = "1.0.0" todo sehr schlecht für japanisch
openKoreanTextVersion = "2.3.1"
jiebeAnalysisVersion = "1.0.2"

#Utils
kotlinxSerializationVersion = "1.7.3"

[libraries]
exposed-core = { module = "org.jetbrains.exposed:exposed-core", version.ref = "exposedVersion" }
exposed-jdbc = { module = "org.jetbrains.exposed:exposed-jdbc", version.ref = "exposedVersion" }
exposed-java-time = { module = "org.jetbrains.exposed:exposed-java-time", version.ref = "exposedVersion" }
exposed-json = { module = "org.jetbrains.exposed:exposed-json", version.ref = "exposedVersion" }
sqlite-jdbc = { module = "org.xerial:sqlite-jdbc", version.ref = "sqliteVersion" }
flyway-core = { module = "org.flywaydb:flyway-core", version.ref = "flywayVersion" }
precompose-core = { module = "moe.tlaster:precompose", version.ref = "precomposeVersion" }
precompose-viewmodel = { module = "moe.tlaster:precompose-viewmodel", version.ref = "precomposeVersion" }
#kotori = { module = "com.github.wanasit.kotori:kotori", version.ref = "kotoriVersion" }
opeanKoreanText = { module = "org.openkoreantext:open-korean-text", version.ref = "openKoreanTextVersion" }
jiebaAnalysis = { module = "com.huaban:jieba-analysis", version.ref = "jiebeAnalysisVersion" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerializationVersion" }
koin-bom = { module = "io.insert-koin:koin-bom", version.ref = "koinVersion" }
koin-core = { module = "io.insert-koin:koin-core" }
logback = { module = "ch.qos.logback:logback-classic", version.ref = "logbackVersion" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttpVersion" }
gson = { module = "com.google.code.gson:gson", version.ref = "gsonVersion" }
kotest = { module = "io.kotest:kotest-assertions-core-jvm", version.ref = "kotestVersion" }
testng = { module = "org.testng:testng", version.ref = "testngVersion" }
carbon-compose = { module = "io.github.gabrieldrn:carbon", version.ref = "carbonDesignVersion" }
config4k = { module = "io.github.config4k:config4k", version.ref = "config4kVersion" }
koalaplot = { module = "io.github.koalaplot:koalaplot-core", version.ref = "koalaplotVersion" }

[bundles]
exposed = ["exposed-core", "exposed-java-time", "exposed-jdbc", "exposed-json"]
precompose = ["precompose-core", "precompose-viewmodel"]

[plugins]
jetbrainsCompose = { id = "org.jetbrains.compose", version.ref = "compose-plugin" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlinSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
conveyor = { id = "dev.hydraulic.conveyor", version.ref = "conveyorVersion" }